# SPDX-License-Identifier: MPL-2.0

name: Alazab CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alazab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Alazab Browser
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install workspace dependencies
        run: deno install

      - name: Check Alazab product layer
        run: deno check browser-features/chrome/common/alazab/index.ts

      - name: Check Alazab New Tab integration
        run: deno check browser-features/pages-newtab/src/App.tsx

      - name: Check Alazab settings integration
        run: deno check browser-features/pages-settings/src/App.tsx

      - name: Run host tests
        run: deno task test:host

      - name: Run smoke tests
        run: deno task test:smoke
